<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css" />

    <script src="main2.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="row">
        <div class="col-md-4 my-5 text-white" v-for="log in logged" class="div">
          <div class="img-id">
            <img :src="log.thumbnail.lqip" alt="" />
            <a :href="log.api_link" class="title">{{log.title}}</a>

            <p class="id">{{log.id}}</p>
          </div>
          <div class="p-3 details">
            <p class="artist-display">{{log.artist_display}}</p>
            <p class="des">{{log.publication_history}}</p>
            <button
              class="btn btn-dark"
              :id="log.id"
              onclick="showDetails(this.id)"
            >
              Read More
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Optional JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
    <script src="main.js"></script>
    <!-- jQuery (no longer required by Bootstrap 5), then Bootstrap JS bundle (includes Popper) -->
    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
